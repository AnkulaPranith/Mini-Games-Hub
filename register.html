

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - Mini Games Hub</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">

            <a class="navbar-brand fw-bold" href="index.html">
                🎮 Mini Games Hub
            </a>

            <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse" data-bs-target="#navbarMenu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarMenu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Home</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="register.html">Register</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="index.html#games">Games</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="about.html">About</a>
                    </li>
                </ul>
            </div>

        </div>
    </nav>

    <!-- Registration Section -->
    <section class="register-section">

        <div class="container">

            <div class="register-card">

                <div class="text-center mb-4">
                    <div class="register-icon">🎮</div>

                    <h2>Create Your Account</h2>

                    <p>Register now and enjoy exciting mini games!</p>
                </div>

                <form id="registerForm" novalidate>

                    <!-- Name -->
                    <div class="mb-3">
                        <label for="playerName" class="form-label">
                            Full Name
                        </label>

                        <input type="text" class="form-control"
                            id="playerName"
                            placeholder="Enter your name">

                        <small class="error-message" id="nameError"></small>
                    </div>

                    <!-- Email -->
                    <div class="mb-3">
                        <label for="playerEmail" class="form-label">
                            Email Address
                        </label>

                        <input type="text" class="form-control"
                            id="playerEmail"
                            placeholder="Enter your email">

                        <small class="error-message" id="emailError"></small>
                    </div>

                    <!-- Age -->
                    <div class="mb-3">
                        <label for="playerAge" class="form-label">
                            Age
                        </label>

                        <input type="number" class="form-control"
                            id="playerAge"
                            placeholder="Enter your age">

                        <small class="error-message" id="ageError"></small>
                    </div>

                    <!-- Password -->
                    <div class="mb-3">
                        <label for="playerPassword" class="form-label">
                            Password
                        </label>

                        <input type="password" class="form-control"
                            id="playerPassword"
                            placeholder="Create a password">

                        <small class="error-message" id="passwordError"></small>
                    </div>

                    <button type="submit" class="btn register-btn w-100">
                        Register Now
                    </button>

                    <div id="successMessage" class="success-message mt-3"></div>

                </form>

                <p class="text-center mt-4">
                    Already registered?
                    <a href="index.html">Explore Games</a>
                </p>

            </div>

        </div>

    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container text-center">
            <h5>🎮 Mini Games Hub</h5>
            <p>© 2026 Mini Games Hub. All Rights Reserved.</p>
        </div>
    </footer>

    <script src="js/register.js"></script>

</body>
</html>
